<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Ledger</title>
<meta name="description" content="A six-day hypertrophy program with set logging, automatic progression and a rest timer.">
<meta name="theme-color" content="#133A61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Ledger">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* -- Tokens -----------------------------------------------
   Palette borrowed from Olympic bumper plates: 45 lb blue,
   25 lb green, 55 lb red, 35 lb yellow. Neutrals carry a
   blue bias so the greys read as steel, not as default grey. */
:root {
  --bg:        #F2F4F7;
  --surface:   #FFFFFF;
  --surface-2: #E7EAEF;
  --line:      #D7DCE4;
  --line-soft: #E7EAEF;
  --ink:       #11151C;
  --ink-2:     #59616E;
  --ink-3:     #868E9B;
  --accent:    #275E9E;
  --accent-2:  #2B6CB0;
  --accent-sf: #E2EBF6;
  --good:      #24794C;
  --good-sf:   #DFF0E6;
  --hot:       #B23127;
  --gold:      #9C7000;
  --shadow:    0 1px 2px rgba(17,21,28,.05), 0 8px 24px rgba(17,21,28,.06);
  --shadow-lg: 0 2px 6px rgba(17,21,28,.08), 0 18px 44px rgba(17,21,28,.14);
  --r:  10px;
  --r2: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0C0F15;
    --surface:   #151A22;
    --surface-2: #1E242F;
    --line:      #2A323F;
    --line-soft: #1E242F;
    --ink:       #EEF1F5;
    --ink-2:     #99A2B0;
    --ink-3:     #6E7787;
    --accent:    #6BA9EA;
    --accent-2:  #5A9BE0;
    --accent-sf: #15263A;
    --good:      #4BBE83;
    --good-sf:   #102B1E;
    --hot:       #EE7466;
    --gold:      #E0A82E;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:        #0C0F15;
  --surface:   #151A22;
  --surface-2: #1E242F;
  --line:      #2A323F;
  --line-soft: #1E242F;
  --ink:       #EEF1F5;
  --ink-2:     #99A2B0;
  --ink-3:     #6E7787;
  --accent:    #6BA9EA;
  --accent-2:  #5A9BE0;
  --accent-sf: #15263A;
  --good:      #4BBE83;
  --good-sf:   #102B1E;
  --hot:       #EE7466;
  --gold:      #E0A82E;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 540px;
  margin: 0 auto;
  padding: calc(20px + env(safe-area-inset-top)) 16px calc(180px + env(safe-area-inset-bottom));
}
img { max-width: 100%; }
[hidden] { display: none !important; }

h1, h2, h3 { font-family: Archivo, ui-sans-serif, system-ui, sans-serif; margin: 0; text-wrap: balance; }

.num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

.eyebrow {
  font: 600 11px/1.3 "IBM Plex Sans", sans-serif;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* -- Screen header ---------------------------------------- */
.head { margin-bottom: 18px; }
.head h1 {
  font-size: 34px; font-weight: 800; letter-spacing: -.028em;
  line-height: 1.04; margin: 6px 0 4px;
}
.head .focus { color: var(--ink-2); font-size: 15px; }
.head .len { color: var(--ink-3); font-size: 13px; margin-top: 6px; }

/* -- Progress rail ---------------------------------------- */
.rail { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.rail > i {
  display: block; height: 100%; border-radius: 3px; background: var(--accent-2);
  transform-origin: left; transition: transform .45s cubic-bezier(.22,.7,.3,1);
}
.rail.done > i { background: var(--good); }
.rail-cap { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.rail-cap .fin { color: var(--good); font-weight: 600; }

/* -- Generic surfaces ------------------------------------- */
.stack { display: flex; flex-direction: column; gap: 10px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  padding: 16px;
}
.note {
  border-left: 3px solid var(--line);
  padding: 2px 0 2px 12px;
  color: var(--ink-2);
  font-size: 13.5px; line-height: 1.5;
}
.note b { color: var(--ink); font-weight: 600; display: block; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 3px; }
.note.cardio { border-left-color: var(--accent-2); }
.note.cardio b { color: var(--accent); }

/* -- Exercise row ----------------------------------------- */
.ex {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r2);
  overflow: hidden;
  transition: border-color .2s ease, box-shadow .25s ease;
}
.ex.open { box-shadow: var(--shadow-lg); border-color: var(--line); }
.ex.logged { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }

.ex-hd {
  width: 100%; display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 15px; background: none; border: 0; text-align: left;
  font: inherit; color: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ex-hd:active { background: var(--surface-2); }

.pip {
  flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px;
  border-radius: 50%; border: 1.5px solid var(--line);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: transparent;
  transition: background .25s ease, border-color .25s ease, transform .3s cubic-bezier(.2,1.5,.5,1);
}
.ex.logged .pip { background: var(--good); border-color: var(--good); color: #fff; transform: scale(1.06); }

.ex-name { font-weight: 600; font-size: 15.5px; letter-spacing: -.005em; }
.ex-meta { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.ex-meta .sep { opacity: .45; margin: 0 5px; }
.ex-hint { font-size: 12.5px; font-weight: 500; color: var(--accent); margin-top: 4px; }
.ex.logged .ex-hint { color: var(--good); }
.opt {
  display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 5px;
  background: var(--surface-2); color: var(--ink-3);
  font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  vertical-align: 2px;
}
.caret { flex: 0 0 auto; color: var(--ink-3); font-size: 13px; margin-top: 4px; transition: transform .25s ease; }
.ex.open .caret { transform: rotate(90deg); }

/* -- Logger ----------------------------------------------- */
.log { padding: 0 15px 15px; border-top: 1px solid var(--line-soft); }
.log-cue {
  display: flex; gap: 14px; flex-wrap: wrap;
  padding: 12px 0 13px; font-size: 13px; color: var(--ink-2);
}
.log-cue span b { color: var(--ink); font-weight: 600; }
.coach { font-size: 13px; line-height: 1.5; color: var(--ink-2); padding-bottom: 12px; }

.prev { font-size: 12.5px; color: var(--ink-2); padding-bottom: 11px; }
.prev .d { color: var(--ink-3); }

.sugg {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--accent-sf); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  color: var(--accent); border-radius: var(--r); padding: 10px 12px;
  font: inherit; cursor: pointer; text-align: left; margin-bottom: 12px;
  -webkit-tap-highlight-color: transparent;
}
.sugg:active { transform: scale(.985); }
.sugg .lead { font-weight: 600; font-size: 13.5px; }
.sugg .why { font-size: 12px; opacity: .85; margin-top: 1px; }
.sugg .nextwk { margin-top: 4px; padding-top: 4px; border-top: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); opacity: .8; }
.nextup { font: 600 12px "IBM Plex Mono", monospace; color: var(--accent); margin-top: 3px; }
.sugg .go { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; opacity: .8; }

table.sets { width: 100%; border-collapse: collapse; }
table.sets th {
  font: 600 10.5px/1 "IBM Plex Sans", sans-serif; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3); text-align: left;
  padding: 0 0 7px;
}
table.sets th.n { width: 26px; }
table.sets th.c { width: 42px; }
table.sets td { padding: 0 0 7px; }
table.sets td.n { color: var(--ink-3); font-size: 13px; font-weight: 600; }
td.w { padding-right: 7px !important; }

.fld {
  width: 100%; padding: 9px 6px; text-align: center;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid transparent; border-radius: 8px;
  font: 600 16px/1 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
}
.fld::placeholder { color: var(--ink-3); font-weight: 500; }
.fld:focus { outline: none; border-color: var(--accent-2); background: var(--surface); }
tr.set-done .fld { color: var(--ink-2); background: transparent; }

.tick {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink-3); font-size: 15px; font-weight: 800;
  cursor: pointer; padding: 0;
  transition: background .2s ease, color .2s ease, border-color .2s ease, transform .3s cubic-bezier(.2,1.5,.5,1);
  -webkit-tap-highlight-color: transparent;
}
.tick:active { transform: scale(.9); }
tr.set-done .tick { background: var(--good); border-color: var(--good); color: #fff; transform: scale(1.04); }

.plates {
  font: 500 11.5px/1 "IBM Plex Mono", monospace;
  color: var(--ink-3); padding: 1px 0 9px 26px; letter-spacing: -.01em;
}

.addset {
  width: 100%; padding: 9px; margin-top: 3px;
  background: none; border: 1px dashed var(--line); border-radius: var(--r);
  color: var(--accent); font: 600 13px "IBM Plex Sans", sans-serif; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.addset:active { background: var(--surface-2); }

/* -- Rest timer ------------------------------------------- */
#timer {
  position: fixed; left: 50%; transform: translate(-50%, 130%);
  bottom: calc(68px + env(safe-area-inset-bottom) + 10px);
  width: min(508px, calc(100vw - 32px)); z-index: 40;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--line); border-radius: var(--r2);
  box-shadow: var(--shadow-lg);
  padding: 13px 15px 14px;
  transition: transform .42s cubic-bezier(.2,.9,.3,1.08), opacity .3s ease;
  opacity: 0; pointer-events: none;
}
#timer.up { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
#timer .rail { margin-bottom: 11px; }
#timer .rail > i { transition: none; background: var(--accent-2); }
#timer.done .rail > i { background: var(--good); }
.t-row { display: flex; align-items: center; gap: 9px; }
.t-lab { flex: 1; }
.t-lab .eyebrow { display: block; }
#t-clock {
  font: 700 29px/1.05 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  letter-spacing: -.02em; margin-top: 1px;
}
#timer.done #t-clock { color: var(--good); }
.t-btn {
  padding: 9px 13px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  font: 600 13.5px "IBM Plex Sans", sans-serif; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.t-btn:active { transform: scale(.95); }
.t-btn.pri { background: var(--accent-sf); border-color: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent); }
#timer.done .t-btn.pri { background: var(--good-sf); border-color: color-mix(in srgb, var(--good) 40%, transparent); color: var(--good); }

/* -- Tab bar ---------------------------------------------- */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; justify-content: center; gap: 2px;
  padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 84%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--line);
}
#tabs button {
  flex: 1; max-width: 128px; padding: 7px 4px 5px;
  background: none; border: 0; border-radius: 10px; cursor: pointer;
  color: var(--ink-3); display: grid; gap: 3px; justify-items: center;
  font: 600 10.5px/1 "IBM Plex Sans", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#tabs button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
#tabs button[aria-selected="true"] { color: var(--accent); }

/* -- Volume chart ----------------------------------------- */
.vol { display: grid; gap: 7px; }
.vrow { display: grid; grid-template-columns: 64px 1fr 26px; align-items: center; gap: 9px; }
.vlab { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.vtrack { position: relative; height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.vband { position: absolute; top: 0; bottom: 0; background: var(--line); }
.vfill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; background: var(--accent-2); }
.vfill.ok { background: var(--good); }
.vnum { font: 600 12.5px "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }

.note b.ramp { display: inline; text-transform: none; letter-spacing: 0; font-size: 13.5px; margin: 0; }
.note b.ramp.now { color: var(--accent); }
.note b.ramp.now::after { content: " \2190 you are here"; font-weight: 500; font-size: 11.5px; letter-spacing: .02em; }
.panel.ramping { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); }
.panel.ramping .note { border-left-color: var(--accent); }
.panel.ramping .note b { color: var(--accent); }
.wkchip {
  display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 5px;
  background: var(--accent-sf); color: var(--accent);
  font-size: 10px; font-weight: 700; letter-spacing: .07em; vertical-align: 1px;
}
.shaperow { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.shaperow + .shaperow { border-top: 1px solid var(--line-soft); }
.slab { font-size: 14px; font-weight: 600; }
.ssub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.scount { margin-left: auto; text-align: right; white-space: nowrap; }
.scount b { font: 700 18px "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.scount b.on { color: var(--good); }
.scount b.off { color: var(--accent); }
.scount span { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

/* -- Day card --------------------------------------------- */
.day {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); padding: 14px 15px;
  -webkit-tap-highlight-color: transparent;
}
.day:active { background: var(--surface-2); }
.day.today { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
.day-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day h3 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin: 5px 0 2px; }
.day .focus { font-size: 13px; color: var(--ink-2); }
.day .cd { font-size: 12.5px; color: var(--accent); font-weight: 500; margin-top: 5px; }
.badge {
  padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-3);
  font: 700 9.5px "IBM Plex Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase;
}
.badge.now { background: var(--accent-sf); color: var(--accent); }
.day .cnt { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-3); }

/* -- Fuel ------------------------------------------------- */
.seg { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 11px; margin-bottom: 14px; }
.seg button {
  flex: 1; padding: 8px; border: 0; border-radius: 8px; background: none; cursor: pointer;
  color: var(--ink-2); font: 600 13px "IBM Plex Sans", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.kcal { display: flex; align-items: baseline; gap: 6px; margin: 3px 0 2px; }
.kcal .v { font: 800 40px/1 Archivo, sans-serif; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.kcal .u { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.macrobar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 13px 0 12px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.macro .dot { width: 8px; height: 8px; border-radius: 50%; margin-bottom: 5px; }
.macro .g { font: 700 19px/1 "IBM Plex Mono", monospace; letter-spacing: -.03em; }
.macro .n { font-size: 11.5px; font-weight: 500; color: var(--ink-2); margin-top: 3px; }
.mp { background: var(--hot); } .mc { background: var(--gold); } .mf { background: var(--accent-2); }

.mathrow { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 13.5px; }
.mathrow + .mathrow { border-top: 1px solid var(--line-soft); }
.mathrow span { color: var(--ink-2); }
.mathrow b { font: 600 14px "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.mathrow.sum b { color: var(--accent); }

table.food { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.food td { padding: 9px 0; border-top: 1px solid var(--line-soft); }
table.food tr:first-child td { border-top: 0; }
table.food td.p { text-align: right; font: 700 14px "IBM Plex Mono", monospace; color: var(--hot); white-space: nowrap; }
table.food .sv { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

/* -- Progress --------------------------------------------- */
.prow {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); padding: 13px 15px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.prow:active { background: var(--surface-2); }
.prow .nm { font-weight: 600; font-size: 14.5px; }
.prow .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.prow .top { font: 600 14px "IBM Plex Mono", monospace; margin-top: 3px; }
.spark { flex: 0 0 auto; }
.trend { font: 700 11px "IBM Plex Mono", monospace; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.tup { background: var(--good-sf); color: var(--good); }
.tdn { background: color-mix(in srgb, var(--hot) 15%, transparent); color: var(--hot); }
.tfl { background: var(--surface-2); color: var(--ink-3); }
.tnw { background: var(--accent-sf); color: var(--accent); }

.hist { font-size: 13px; }
.hist .h { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.hist .h:first-child { border-top: 0; }
.hist .hd { color: var(--ink-3); font-size: 12px; }
.hist .hs { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12.5px; text-align: right; }

.empty { text-align: center; padding: 30px 18px; color: var(--ink-2); font-size: 14px; line-height: 1.55; }
.empty h3 { font-size: 17px; margin-bottom: 6px; color: var(--ink); }

.sync { text-align: center; font-size: 11.5px; color: var(--ink-3); margin-top: 18px; }
.sync b { font-weight: 600; color: var(--ink-2); }

.ex.cardio-card { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); }
.ex.cardio-card .ex-name { color: var(--accent); }
.ex.cardio-card.logged { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.ex.cardio-card.logged .ex-name { color: var(--good); }
.cardio-how { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin-top: 6px; white-space: pre-line; }
.ta {
  text-align: left !important;
  font: 400 13px/1.45 "IBM Plex Sans", sans-serif !important;
  resize: vertical; min-height: 58px;
}

   YOUR EDITS
   The program above is the starting point, not the law.
   Every field you change is stored as an override on top of
   it, so the defaults stay intact and "reset" always works.
   --------------------------------------------------------- */
let edits = { ov: {}, add: {}, rm: {}, fuel: {}, cardio: {}, at: 0 };

const withOv = e => { const o = edits.ov[e.id]; return o ? Object.assign({}, e, o) : e; };

/** The exercises actually in a day: defaults minus removals, plus your own. */
function dayEx(day) {
  const base = day.ex.filter(e => !edits.rm[e.id]).map(withOv);
  const mine = (edits.add[day.key] || []).filter(e => !edits.rm[e.id]).map(withOv);
  return base.concat(mine);
}

const ARCHIVE = {
  hanging_oblique: { id:'hanging_oblique', name:'Hanging Oblique Raise', m:'obl', sets:3, rep:[10,12], rest:60, rir:1, cue:'Per side. Knees up and across toward one armpit. Loads the oblique in a lengthened position, which is where it grows best \u2014 the highest-value oblique builder there is. Add an ankle weight once you clear 12 clean reps a side.' },
  decline_situp: { id:'decline_situp', name:'Decline Weighted Sit-Up', m:'abs', sets:3, rep:[8,10], rest:75, rir:1 }
};

function customById(id) {
  for (const k in edits.add) {
    const hit = (edits.add[k] || []).find(x => x.id === id);
    if (hit) return hit;
  }
  return null;
}

/** Resolve any exercise id, including ones you removed but already logged. */
function lookup(id) {
  const base = BASE_EX[id] || customById(id) || ARCHIVE[id];
  return base ? withOv(base) : null;
}

function setOv(id, field, value) {
  const base = BASE_EX[id] || customById(id);
  if (!base) return;
  const custom = !BASE_EX[id];
  edits.ov[id] = edits.ov[id] || {};
  // Matching the default again is not an edit - drop it so reset stays meaningful.
  if (!custom && JSON.stringify(base[field]) === JSON.stringify(value)) delete edits.ov[id][field];
  else edits.ov[id][field] = value;
  if (!Object.keys(edits.ov[id]).length) delete edits.ov[id];
  saveEdits();
}

const isEdited = id => !!edits.ov[id] || !BASE_EX[id];

/** Says plainly whether this phone can open the app with no signal. */

/* The whole log is one JSON file you can hand to another phone. */
function exportBackup() {
  const blob = new Blob([JSON.stringify({ v: 1, exported: TODAY, logs, edits }, null, 2)],
                        { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'iron-ledger-' + TODAY + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();

}

function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); }
    catch (e) { alert('That file is not a valid backup.'); return; }
    if (!d || typeof d !== 'object' || (!d.logs && !d.edits)) {
      alert('That file is not an Iron Ledger backup.');
      return;
    }
    if (d.logs) { logs = d.logs; saveLocal(); }
    if (d.edits) {
      edits = Object.assign({ ov:{}, add:{}, rm:{}, fuel:{}, cardio:{}, at:0 }, d.edits);
      try { localStorage.setItem(LSE, JSON.stringify(edits)); } catch (e) {}
    }
    draft = {};
    render();
    alert('Backup restored.');
  };
  r.readAsText(file);
}

/* ===========================================================
   TRAINING MATH
   =========================================================== */
const DEFAULT_START = '2026-09-21';   // Monday

/** Which week of the program today falls in, counting the start date as week 1. */
function programWeek() {
  const [y, m, d] = (edits.start || DEFAULT_START).split('-').map(Number);
  const start = new Date(y, m - 1, d);
  const now = new Date();
  start.setHours(0, 0, 0, 0);
  now.setHours(0, 0, 0, 0);
  const days = Math.round((now - start) / 86400000);
  if (days < 0) return { before: true, until: -days, n: 0 };
  return { before: false, until: 0, n: Math.floor(days / 7) + 1 };
}

/* The ramp exists because tendons lag muscle by a few weeks after a
   layoff. It expires on its own once week 4 comes around. */
function rampNote(n) {
  if (n <= 2) return ['Easing back in \u00b7 week ' + n + ' of 3',
    'Two sets per exercise instead of three or four, and stop 3\u20134 reps short of the prescribed RIR. Skip anything marked optional, and leave the Nordic curl and heavy eccentrics alone. The weights will feel light \u2014 that is the point.'];
  if (n === 3) return ['Easing back in \u00b7 week 3 of 3',
    'Full sets this week, still a rep or two further from failure than prescribed. Next week you run the program as written.'];
  return null;
}

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY = iso(new Date());

function e1rm(w, r) {            // Epley
  if (!(w > 0) || !(r > 0)) return 0;
  return r === 1 ? w : w * (1 + r / 30);
}
function topSet(sets) {
  if (!sets || !sets.length) return null;
  return sets.reduce((b, s) => e1rm(s.w, s.r) > e1rm(b.w, b.r) ? s : b);
}
function history(exId) {
  const byDate = logs[exId] || {};
  return Object.keys(byDate).sort().map(d => ({ date: d, sets: byDate[d].sets || [] }));
}
function lastBefore(exId, date) {
  const h = history(exId).filter(s => s.date < date);
  return h.length ? h[h.length - 1] : null;
}

/* ---------------------------------------------------------
   PROGRESSION
   Double progression: hold the load, climb the rep range,
   then add weight and start the climb again. It is the model
   that actually drives hypertrophy, and it is the one thing
   a training app can do for you that a notebook cannot.
   --------------------------------------------------------- */

/** Barbells move in 5 lb jumps - the smallest pair of plates is 2.5 a side. */
const roundLoad = (w, ex) => { const inc = ex.bar ? 5 : 2.5; return Math.round(w / inc) * inc; };
const stepFor = (w, ex) => (w < 50 ? (ex.bar ? 5 : 2.5) : 5);

function plan(exId) {
  const ex = lookup(exId);
  if (!ex) return null;
  const h = history(exId).filter(s => s.date < TODAY);
  const [lo, hi] = ex.rep;

  if (!h.length) {
    return {
      state: 'start', ex, reps: hi,
      headline: 'Find your working weight',
      reason: `Warm up, then pick a load you could stop about ${ex.rir + 2} reps short of at ${hi} reps. Under-shoot it \u2014 every session after this one tells you exactly what to do.`
    };
  }

  const last = h[h.length - 1];
  const top = topSet(last.sets);
  if (!top) return null;
  const allTop = last.sets.every(s => s.r >= hi);
  const step = stepFor(top.w, ex);

  // Stalled: three sessions and the top set's estimated 1RM has not moved.
  let stalled = false;
  if (h.length >= 3 && !allTop) {
    const e = h.slice(-3).map(x => { const t = topSet(x.sets); return t ? e1rm(t.w, t.r) : 0; });
    stalled = e[2] <= e[0] + 0.5;
  }

  if (allTop) {
    // Blowing through the top of the range means the jump was too small.
    // Common when you are regaining rather than building - take a bigger bite.
    const over = Math.min(...last.sets.map(x => x.r)) - hi;
    const mult = over >= 4 ? 3 : over >= 2 ? 2 : 1;
    const w = roundLoad(top.w + step * mult, ex);
    return {
      state: 'load', ex, weight: w, reps: lo, last,
      headline: `${w} lb \u00d7 ${lo}`,
      reason: mult > 1
        ? `You cleared ${hi} on every set at ${top.w} lb with ${over} to spare, so that is a ${step * mult} lb jump, not ${step}. You are regaining, not grinding.`
        : `You hit ${hi} on every set at ${top.w} lb, so the weight goes up.`,
      next: `Then climb back to ${hi} reps at ${w} lb before adding more.`
    };
  }

  if (stalled) {
    const w = roundLoad(top.w * 0.9, ex);
    return {
      state: 'stall', ex, weight: w, reps: hi, last,
      headline: `Drop to ${w} lb \u00d7 ${hi}`,
      reason: `Three sessions stuck at ${top.w} lb. That is a stall, not bad luck.`,
      next: `Rebuild from ${w} lb and you will pass ${top.w} in two or three weeks. If it stalls again, swap the exercise.`
    };
  }

  const worst = Math.min(...last.sets.map(x => x.r));
  const target = Math.min(hi, worst + 1);
  const up = roundLoad(top.w + step, ex);
  return {
    state: 'hold', ex, weight: top.w, reps: target, last,
    headline: `${top.w} lb \u00d7 ${target}`,
    reason: `Same weight. Your worst set last time was ${worst} reps \u2014 get ${target} on all ${ex.sets}.`,
    next: `Once every set reaches ${hi}, you move to ${up} lb.`
  };
}

/** Short form for the exercise list. */
function planHint(exId) {
  const p = plan(exId);
  if (!p) return '';
  if (p.state === 'start') return 'First session \u2014 find your working weight';
  return p.headline + (p.state === 'load' ? '  \u2191' : p.state === 'stall' ? '  deload' : '');
}

/** Per-side plate loading. A real plate rack: 45s down to 2.5s. */
function plateMath(total, bar) {
  let side = (total - bar) / 2;
  if (side <= 0) return side === 0 ? 'empty bar' : null;
  const out = [];
  [45, 35, 25, 10, 5, 2.5].forEach(p => {
    let n = Math.floor(side / p + 1e-9);
    if (n > 0) { out.push(n > 1 ? `${p}\u00d7${n}` : `${p}`); side -= n * p; }
  });
  if (side > 0.01) return null;   // can't be made with standard plates
  return out.join(' + ') + ' per side';
}

/* The V-taper is three levers and a ratio: side delts for width,
   lats for the flare, upper chest for the shelf, and a waist that
   stays tight underneath all of it. Tracked apart from the muscle
   chart because these are the ones the look actually depends on. */
const SHAPE = [
  ['side',  'Side delts',  'shoulder width \u2014 the biggest lever', 12, 18],
  ['lat',   'Lat width',   'vertical pulls, the flare',               8, 14],
  ['upper', 'Upper chest', 'the shelf under the collarbone',          6, 12],
  ['abs',   'Abs',         'the taper needs a tight waist',          12, 20]
];

function weeklyShape() {
  const t = { side: 0, lat: 0, upper: 0, abs: 0 };
  PLAN.forEach(d => dayEx(d).forEach(e => {
    const n = +e.sets || 0;
    if (e.tag && t[e.tag] !== undefined) t[e.tag] += n;
    if (e.m === 'abs') t.abs += n;
  }));
  return t;
}

function weeklyVolume() {
  const t = {};
  PLAN.forEach(d => dayEx(d).forEach(e => { t[e.m] = (t[e.m] || 0) + (+e.sets || 0); }));
  return t;
}
function estMinutes(day) {
  const list = dayEx(day);
  if (!list.length) return 0;
  return Math.round(list.reduce((s, e) => s + (+e.sets || 0) * ((+e.rest || 0) + 45), 0) / 60) + 8;
}
const dayFor = d => PLAN.find(x => x.idx === d.getDay()) || PLAN[0];

const fmtDate = s => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};
const mmss = t => `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ===========================================================
   REST TIMER
   Owns a wall-clock deadline, not a tick count, so it stays
   honest when the screen sleeps between sets.
   =========================================================== */
const T = { el:document.getElementById('timer'), fill:document.getElementById('t-fill'),
            clock:document.getElementById('t-clock'), lab:document.getElementById('t-lab'),
            deadline:0, span:0, tick:null, fired:false };

let audioCtx = null;
function chime() {
  if (navigator.vibrate) { try { navigator.vibrate([90, 70, 90]); } catch (e) {} }
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(delay => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.type = 'sine';
      const t0 = audioCtx.currentTime + delay;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.22, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) {}
}

function startRest(seconds) {
  T.span = seconds;
  T.deadline = Date.now() + seconds * 1000;
  T.fired = false;
  T.el.classList.remove('done');
  T.el.classList.add('up');
  T.lab.textContent = 'Resting';
  if (!T.tick) T.tick = setInterval(paintTimer, 200);
  paintTimer();
}
function paintTimer() {
  const leftMs = Math.max(0, T.deadline - Date.now());
  const left = Math.ceil(leftMs / 1000);
  T.clock.textContent = mmss(left);
  T.fill.style.transform = `scaleX(${T.span ? leftMs / (T.span * 1000) : 0})`;
  if (left === 0 && !T.fired) {
    T.fired = true;
    T.el.classList.add('done');
    T.lab.textContent = 'Rest complete';
    document.getElementById('t-skip').textContent = 'Done';
    chime();
  }
}
function stopRest() {
  T.el.classList.remove('up');
  clearInterval(T.tick); T.tick = null;
  document.getElementById('t-skip').textContent = 'Skip';
}
document.getElementById('t-skip').onclick = stopRest;
document.getElementById('t-add').onclick = () => {
  const left = Math.max(0, T.deadline - Date.now());
  T.span = (left + 30000) / 1000;
  T.deadline = Date.now() + left + 30000;
  T.fired = false;
  T.el.classList.remove('done');
  T.lab.textContent = 'Resting';
  document.getElementById('t-skip').textContent = 'Skip';
  paintTimer();
};

/* ===========================================================
   VIEW STATE
   =========================================================== */
let tab = 'today';
let openEx = null;         // exercise id whose logger is expanded
let openDay = null;        // day key expanded on the Plan tab
let openHist = null;       // exercise id expanded on Progress
let fuelMode = null;   // resolved from the calendar on first render
let editDay = null;        // day key currently in edit mode
let draft = {};            // { exId: [{w:'',r:'',done:false}] }

function draftFor(ex) {
  if (draft[ex.id]) return draft[ex.id];
  const today = (logs[ex.id] || {})[TODAY];
  if (today) {
    draft[ex.id] = today.sets.map(s => ({ w: String(s.w), r: String(s.r), done: true }));
  } else {
    const p = plan(ex.id);
    const seed = p && p.weight ? String(p.weight) : '';
    draft[ex.id] = Array.from({ length: ex.sets }, () => ({ w: seed, r: '', done: false }));
  }
  return draft[ex.id];
}

function commit(exId) {
  const rows = (draft[exId] || []).filter(r => r.done && Number(r.w) >= 0 && Number(r.r) > 0);
  if (!rows.length) {
    if (logs[exId]) { delete logs[exId][TODAY]; persist(exId); }
    return;
  }
  logs[exId] = logs[exId] || {};
  logs[exId][TODAY] = { sets: rows.map(r => ({ w: Number(r.w), r: Number(r.r) })), at: Date.now() };
  persist(exId);
}

const isLogged = exId => !!(logs[exId] || {})[TODAY];

}

  const day = dayFor(new Date());

  const wk = programWeek();
  const ramp = wk.before ? null : rampNote(wk.n);
  const weekChip = wk.before
    ? `<span class="wkchip">Starts in ${wk.until} day${wk.until === 1 ? '' : 's'}</span>`

  if (!list.length) {
    return `

function exCard(ex) {

function cardioEditor(d) {
  const c = dayCardio(d);
  if (!c) return `<button class="addset" data-addcardio="${d.key}" style="margin-top:9px">+ Add cardio</button>`;
  return `
    <div class="erow" style="margin-top:9px">
      <div class="egrid" style="grid-template-columns:2fr 1fr">
        <label>Cardio<input class="ef nm" value="${esc(c.kind)}" data-c="kind" data-id="${d.key}" placeholder="Swim"></label>
        <label>Minutes<input class="ef" inputmode="numeric" value="${c.min}" data-c="min" data-id="${d.key}"></label>
      </div>
      <textarea class="ef ta" data-c="how" data-id="${d.key}" placeholder="How to run it">${esc(c.how)}</textarea>
      <div class="erest"><button class="rm" data-rmcardio="${d.key}">Remove cardio</button></div>
    </div>`;
}

function viewPlan() {
  const vol = weeklyVolume();
  const wc = weeklyCardioPlan();
  const shape = weeklyShape();
  const wk = programWeek();
  const cd = cardioThisWeek();
  const todayKey = dayFor(new Date()).key;
  const ordered = PLAN.slice(1).concat(PLAN[0]);   // Monday first, rest day last

  return `
    <div class="head">
      <h1>The Split</h1>
      <div class="focus">Six lifting days, ${wc.n} cardio session${wc.n === 1 ? '' : 's'}, one full rest day.</div>
    </div>

    <div class="panel" style="margin-bottom:14px">
      <div class="editbar">
        <span class="eyebrow">Easing back in</span>
        <span style="display:flex;align-items:center;gap:7px">
          <span class="elab">Start</span>

        </span>

      <div class="note" style="border:0;padding-left:0;margin-bottom:10px">
        ${wk.before
          ? `Day one is in <b>${wk.until} day${wk.until === 1 ? '' : 's'}</b>. Weeks 1 to 3 below run at reduced volume; the app drops the reminder on its own once week 4 arrives.`

      </div>
      <div class="note" style="border:0;padding-left:0">
        After five months off, do not run this at full volume in week one. Muscle strength returns
        faster than tendons and connective tissue do, so for a few weeks you will be able to lift
        more than your joints are ready for. That gap is where returning lifters get hurt.
        <br><br>
        <b class="ramp${!wk.before && wk.n <= 2 ? ' now' : ''}">Weeks 1&ndash;2</b> &mdash; two sets per exercise instead of three or four, stop
        3&ndash;4 reps short, skip everything marked optional, and leave the Nordic curl and heavy
        eccentrics alone entirely.<br>
        <b class="ramp${!wk.before && wk.n === 3 ? ' now' : ''}">Week 3</b> &mdash; full sets, still a rep or two further from failure than

        <b class="ramp${!wk.before && wk.n >= 4 ? ' now' : ''}">Week 4</b> &mdash; the program as written.

        lean.<br><br>
        One thing worth being clear about: building obliques does not shrink love handles. That is
        subcutaneous fat sitting on top of the muscle, and muscle grows underneath it \u2014 so the

    ${Object.keys(edits.ov).length || Object.keys(edits.rm).length || Object.keys(edits.add).length || Object.keys(edits.cardio || {}).length

    <div class="sync" id="syncline"></div>`;
}

/* -- Fuel ------------------------------------------------- */
function fuelTarget(t) {
  const o = edits.fuel[t.key] || {};
  const m = Object.assign({}, t, o);
  m.kcal = m.p * 4 + m.f * 9 + m.c * 4;      // always agrees with the macros
  return m;
}

function viewFuel() {
  const wk = programWeek();
  if (!fuelMode) fuelMode = wk.before ? 'bridge' : wk.n <= 10 ? 'comeback' : 'simple';
  const targets = (fuelMode === 'bridge' ? [FUEL.bridge]
                 : fuelMode === 'comeback' ? [FUEL.comeback]
                 : fuelMode === 'simple' ? [FUEL.simple]
                 : FUEL.split).map(fuelTarget);
  const simple = fuelTarget(targets.length === 1 ? targets[0] : FUEL.simple);

  const card = t => {
    const pk = t.p * 4, ck = t.c * 4, fk = t.f * 9, tot = pk + ck + fk || 1;
    const field = (k, cls, label) => `
      <div class="macro">
        <div class="dot ${cls}"></div>
        <input class="ef" inputmode="numeric" value="${t[k]}" data-fk="${t.key}" data-fm="${k}"
               aria-label="${label} grams" style="text-align:left;padding:5px 7px">
        <div class="n">${label} &middot; g</div>
      </div>`;
    return `
      <div class="panel">
        <div class="eyebrow">${esc(t.label)}</div>
        <div class="kcal"><span class="v">${t.kcal.toLocaleString()}</span><span class="u">kcal</span></div>
        <div style="font-size:13px;color:var(--ink-2)">${esc(t.detail)}</div>
        <div class="macrobar">
          <div class="mp" style="width:${pk/tot*100}%"></div>
          <div class="mc" style="width:${ck/tot*100}%"></div>
          <div class="mf" style="width:${fk/tot*100}%"></div>
        </div>
        <div class="macros">
          ${field('p','mp','Protein')}
          ${field('c','mc','Carbs')}
          ${field('f','mf','Fat')}
        </div>
      </div>`;
  };

  const tips = list => list.map(([h, b]) =>
    `<div class="panel"><div style="font-weight:600;font-size:14.5px;margin-bottom:3px">${esc(h)}</div>
     <div style="font-size:13.5px;color:var(--ink-2);line-height:1.5">${esc(b)}</div></div>`).join('');

  const surplus = simple.kcal - FUEL.maintenance;

  return `
    <div class="head">
      <h1>Fuel</h1>
      <div class="focus">170 lb \u2192 180\u2013190 lb at about 0.4 lb a week.</div>
    </div>

    <div class="seg">
      <button data-fuel="bridge" aria-selected="${fuelMode === 'bridge'}">Bridge</button>
      <button data-fuel="comeback" aria-selected="${fuelMode === 'comeback'}">Phase 1</button>
      <button data-fuel="simple" aria-selected="${fuelMode === 'simple'}">Phase 2</button>
      <button data-fuel="split" aria-selected="${fuelMode === 'split'}">Train / rest</button>
    </div>

    <div class="stack">${targets.map(card).join('')}</div>
    <div style="font-size:12px;color:var(--ink-3);margin-top:9px">
      ${wk.before
        ? `Day one is in ${wk.until} day${wk.until === 1 ? '' : 's'}. Eat the Bridge number until then, then move to Phase 1.`
        : wk.n <= 10
        ? `You are in week ${wk.n} \u2014 Phase 1 territory. Switch to Phase 2 when your weight and your lifts both stall for two straight weeks, at the earliest around week 11.`
        : `You are in week ${wk.n}. If your weight and lifts have stalled at maintenance, it is time for Phase 2.`}
      Edit any macro and the calories recalculate: protein 4 kcal/g, carbs 4, fat 9.
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="eyebrow" style="margin-bottom:8px">Where the number comes from</div>
      <div class="mathrow"><span>Resting burn</span><b class="num">1,810 kcal</b></div>
      <div class="mathrow"><span>With six lifts + ${weeklyCardioPlan().n} cardio</span><b class="num">${FUEL.maintenance.toLocaleString()} kcal</b></div>
      <div class="mathrow sum"><span>Surplus</span><b class="num">${surplus >= 0 ? '+' : ''}${surplus.toLocaleString()} kcal</b></div>
      <div class="note" style="margin-top:11px;border:0;padding-left:0">
        ${fuelMode === 'bridge'
          ? 'This is below your training maintenance on purpose, because you are not training yet. The protein target is not provisional though - hit 190 g from today. Six months of low protein is most of why the last half year cost you muscle.'
          : fuelMode === 'comeback'
          ? 'Sitting at maintenance is the point of this phase, not a mistake. Regaining muscle you have already built costs almost no extra energy, so a surplus here would only add fat. Hold here until the scale and your lifts both stall.'
          : surplus > 450
          ? 'That is a large surplus. Above roughly 0.75 lb a week the extra mostly arrives as fat.'
          : surplus < 50
          ? 'That is at or below maintenance \u2014 you will hold weight rather than build.'
          : 'A surplus around 200 kcal is deliberately small. Past a point, a bigger one does not build muscle any faster \u2014 it just adds the fat you would then have to diet back off.'}
      </div>
    </div>

    <div class="eyebrow" style="margin:20px 0 9px">Timing</div>
    <div class="stack">${tips(FUEL.timing)}</div>

    <div class="eyebrow" style="margin:20px 0 9px">Adjusting</div>
    <div class="stack">${tips(FUEL.adjust)}</div>

    ${Object.keys(edits.fuel).length
      ? `<button class="resetbtn" data-resetfuel="1" style="margin-top:16px">Reset macros to the original targets</button>` : ''}
    <div class="sync" id="syncline"></div>`;
}

/* -- Progress --------------------------------------------- */
function sparkline(vals) {
  if (vals.length < 2) return '';
  const w = 58, h = 24, pad = 2;
  const min = Math.min(...vals), max = Math.max(...vals), span = Math.max(max - min, 1);
  const pts = vals.map((v, i) => [
    pad + i * (w - pad * 2) / (vals.length - 1),
    h - pad - ((v - min) / span) * (h - pad * 2)
  ]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="var(--accent-2)"/>
  </svg>`;
}

function viewProgress() {
  const rows = Object.keys(logs)
    .filter(id => lookup(id) && history(id).length)
    .map(id => {
      const h = history(id);
      const curve = h.map(s => { const t = topSet(s.sets); return t ? e1rm(t.w, t.r) : 0; });
      const latest = h[h.length - 1], lt = topSet(latest.sets);
      let trend = 'new';
      if (h.length >= 2) {
        const a = curve[curve.length - 1], b = curve[curve.length - 2];
        trend = a > b + 0.5 ? 'up' : a < b - 0.5 ? 'down' : 'flat';
      }
      const np = plan(id);
      return { id, name: lookup(id).name, h, curve, latest, lt, trend, best: Math.max(...curve),
               nextUp: np && np.weight ? np.headline : null };
    })
    .sort((a, b) => a.latest.date < b.latest.date ? 1 : -1);

  const badge = { up:['tup','\u25b2 up'], down:['tdn','\u25bc down'], flat:['tfl','= same'], new:['tnw','\u2605 new'] };

  return `
    <div class="head">
      <h1>Progress</h1>
      <div class="focus">${rows.length ? `${rows.length} exercise${rows.length === 1 ? '' : 's'} tracked \u00b7 estimated 1RM from your top set` : 'Your training history, once you start logging.'}</div>
    </div>

    ${!rows.length ? `
      <div class="panel empty">
        <h3>Nothing logged yet</h3>
        Open Today, tap an exercise, and tick off a set. Every set you close lands here,
        and the app starts telling you what to lift next.
      </div>` : `
      <div class="stack">
        ${rows.map(r => {
          const [cls, lab] = badge[r.trend];
          const open = openHist === r.id;
          return `
            <div>
              <button class="prow" data-hist="${r.id}" aria-expanded="${open}">
                <span style="flex:1;min-width:0">
                  <span class="nm">${esc(r.name)}</span>
                  <div class="sub">${r.h.length} session${r.h.length === 1 ? '' : 's'} \u00b7 last ${fmtDate(r.latest.date)} \u00b7 best e1RM ${Math.round(r.best)} lb</div>
                  <div class="top">${r.lt.w} lb \u00d7 ${r.lt.r}</div>
                  ${r.nextUp ? `<div class="nextup">Next: ${esc(r.nextUp)}</div>` : ''}
                </span>
                ${sparkline(r.curve)}
                <span class="trend ${cls}">${lab}</span>
              </button>
              ${open ? `
                <div class="panel" style="margin-top:8px">
                  <div class="hist">
                    ${r.h.slice().reverse().map(s => `
                      <div class="h">
                        <span class="hd">${fmtDate(s.date)}</span>
                        <span class="hs">${s.sets.map(x => `${x.w}\u00d7${x.r}`).join('  \u00b7  ')}</span>
                      </div>`).join('')}
                  </div>
                </div>` : ''}
            </div>`;
        }).join('')}
      </div>`}
    <div class="panel" style="margin-top:18px">
      <div class="eyebrow" style="margin-bottom:8px">Your data</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:11px">
        Everything you log lives on this phone. Export a copy every few weeks, and before you
        change phones or clear Safari's data.
      </div>
      <div style="display:flex;gap:8px">
        <button class="t-btn pri" data-export="1" style="flex:1">Export a backup</button>
        <button class="t-btn" data-import="1" style="flex:1">Restore</button>
      </div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:11px">${offlineLine()}</div>
      <input type="file" accept="application/json,.json" id="importfile" hidden>
    </div>
    <div class="sync" id="syncline"></div>`;
}

  ['today', 'Today', '<path d="M12 3c0 3-4 4-4 8a4 4 0 0 0 8 0c0-1.5-.8-2.6-1.6-3.6"/><path d="M12 21a7 7 0 0 1-7-7"/>'],

  ['fuel', 'Fuel', '<path d="M7 3v18M7 3a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3 3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M17 3c-1.5 2-2 4-2 6s.7 3 2 3 2-1 2-3-.5-4-2-6zM17 12v9"/>'],
  ['progress', 'Progress', '<path d="M3 17l5-5 4 4 8-8"/><path d="M16 8h4v4"/>']
];

document.getElementById('tabs').innerHTML = TABS.map(([k, label, svg]) =>
  `<button data-tab="${k}" aria-selected="${tab === k}"><svg viewBox="0 0 24 24">${svg}</svg>${label}</button>`
).join('');

document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === tab));
  window.scrollTo(0, 0);
  render();
};

function wire() {
  app.onclick = e => {
    const t = e.target;

    const toggle = t.closest('[data-toggle]');
    if (toggle) {
      const id = toggle.dataset.toggle;
      openEx = openEx === id ? null : id;
      render();
      if (openEx) {
        const el = document.querySelector(`[data-ex="${openEx}"]`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      return;
    }

    const fill = t.closest('[data-fill]');
    if (fill) {
      const ex = lookup(fill.dataset.fill), p = plan(ex.id);
      if (p && p.weight) draftFor(ex).forEach(r => { if (!r.done) r.w = String(p.weight); });
      render();
      return;
    }

    const tick = t.closest('[data-tick]');
    if (tick) {
      const ex = lookup(tick.dataset.tick), i = +tick.dataset.i;
      const rows = draftFor(ex), row = rows[i];
      if (!row.done) {
        if (!(Number(row.r) > 0)) {                 // nothing to close out yet
          if (navigator.vibrate) { try { navigator.vibrate(45); } catch (err) {} }
          const input = app.querySelector(`[data-ex="${ex.id}"][data-i="${i}"][data-f="r"]`);
          if (input) input.focus();
          return;
        }
        row.done = true;
        commit(ex.id);
        startRest(ex.rest);
      } else {
        row.done = false;
        commit(ex.id);
      }
      render();
      return;
    }

    const add = t.closest('[data-add]');
    if (add) {
      const rows = draftFor(lookup(add.dataset.add));
      rows.push({ w: rows.length ? rows[rows.length - 1].w : '', r: '', done: false });
      render();
      return;
    }

    const day = t.closest('[data-day]');
    if (day) { openDay = openDay === day.dataset.day ? null : day.dataset.day; render(); return; }

    const hist = t.closest('[data-hist]');
    if (hist) { openHist = openHist === hist.dataset.hist ? null : hist.dataset.hist; render(); return; }

    if (t.closest('[data-export]')) { exportBackup(); return; }
    if (t.closest('[data-import]')) {
      const f = document.getElementById('importfile');
      f.onchange = () => { if (f.files && f.files[0]) importBackup(f.files[0]); f.value = ''; };
      f.click();
      return;
    }

    const fuel = t.closest('[data-fuel]');
    if (fuel) { fuelMode = fuel.dataset.fuel; render(); return; }

    const ct = t.closest('[data-cardiotick]');
    if (ct) {
      const c = dayCardio(dayFor(new Date()));
      if (c) {
        if (!cardioDone() && navigator.vibrate) { try { navigator.vibrate(35); } catch (err) {} }
        toggleCardio(c);
        render();
      }
      return;
    }

    /* ---- editing ---- */

    const ed = t.closest('[data-edit]');
    if (ed) { editDay = editDay === ed.dataset.edit ? null : ed.dataset.edit; render(); return; }

    const step = t.closest('[data-rest]');
    if (step) {
      const ex = lookup(step.dataset.rest);
      const next = Math.max(15, Math.min(600, (+ex.rest || 0) + (+step.dataset.d)));
      setOv(ex.id, 'rest', next);
      render();
      return;
    }

    const rm = t.closest('[data-rm]');
    if (rm) { edits.rm[rm.dataset.rm] = true; saveEdits(); render(); return; }

    const addex = t.closest('[data-addex]');
    if (addex) {
      const key = addex.dataset.addex;
      const day = PLAN.find(d => d.key === key);
      // Inherit the day's dominant muscle so the weekly volume chart stays honest.
      const tally = {};
      day.ex.forEach(e => { tally[e.m] = (tally[e.m] || 0) + 1; });
      const m = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || 'chest';
      edits.add[key] = edits.add[key] || [];
      edits.add[key].push({
        id: 'own_' + Date.now().toString(36),
        name: 'New exercise', m, sets: 3, rep: [8, 12], rest: 90, rir: 1
      });
      saveEdits();
      render();
      return;
    }

    const ac = t.closest('[data-addcardio]');
    if (ac) {
      edits.cardio = edits.cardio || {};
      edits.cardio[ac.dataset.addcardio] = { kind: 'Swim', min: 20, how: 'Easy continuous. Conversational pace.' };
      saveEdits();
      render();
      return;
    }

    const rc = t.closest('[data-rmcardio]');
    if (rc) {
      edits.cardio = edits.cardio || {};
      edits.cardio[rc.dataset.rmcardio] = null;   // null = deliberately removed
      saveEdits();
      render();
      return;
    }

    const rd = t.closest('[data-resetday]');
    if (rd) {
      const key = rd.dataset.resetday;
      const day = PLAN.find(d => d.key === key);
      day.ex.forEach(e => { delete edits.ov[e.id]; delete edits.rm[e.id]; });
      (edits.add[key] || []).forEach(e => { delete edits.ov[e.id]; delete edits.rm[e.id]; });
      delete edits.add[key];
      if (edits.cardio) delete edits.cardio[key];
      saveEdits();
      render();
      return;
    }

    if (t.closest('[data-resetall]')) {
      edits = { ov: {}, add: {}, rm: {}, fuel: {}, cardio: {}, at: 0 };
      saveEdits();
      editDay = null;
      render();
      return;
    }

    if (t.closest('[data-resetfuel]')) { edits.fuel = {}; saveEdits(); render(); return; }
  };

  // Field edits mutate the draft in place \u2014 no re-render, so the keyboard
  // stays up and the caret stays put while you type.
  app.oninput = e => {
    const f = e.target.closest('[data-f]');
    if (!f) return;
    const rows = draft[f.dataset.ex];
    if (!rows) return;
    rows[+f.dataset.i][f.dataset.f] = f.value;
    if (rows[+f.dataset.i].done) commit(f.dataset.ex);
  };

  // Program + macro fields write straight through; the view only
  // re-renders on blur, so typing is never interrupted mid-number.
  app.addEventListener('input', e => {
    const p = e.target.closest('[data-e]');
    if (p) {
      const id = p.dataset.id, field = p.dataset.e, raw = p.value.trim();
      if (field === 'name') { setOv(id, 'name', raw || 'Untitled'); return; }
      const n = parseInt(raw, 10);
      if (!Number.isFinite(n)) return;                       // mid-typing, wait
      if (field === 'rep0' || field === 'rep1') {
        const cur = lookup(id).rep;
        const rep = field === 'rep0' ? [Math.max(1, n), cur[1]] : [cur[0], Math.max(1, n)];
        setOv(id, 'rep', rep);
      } else if (field === 'sets') setOv(id, 'sets', Math.max(1, Math.min(20, n)));
      else if (field === 'rir')    setOv(id, 'rir',  Math.max(0, Math.min(5, n)));
      return;
    }

    const c = e.target.closest('[data-c]');
    if (c) {
      const field = c.dataset.c, raw = c.value;
      if (field === 'min') {
        const n = parseInt(raw.trim(), 10);
        if (Number.isFinite(n) && n >= 0) setCardio(c.dataset.id, 'min', Math.min(n, 300));
      } else {
        setCardio(c.dataset.id, field, raw);
      }
      return;
    }

    if (e.target.closest('[data-start]')) {
      const v = e.target.value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { edits.start = v; saveEdits(); }
      return;
    }

    const m = e.target.closest('[data-fm]');
    if (m) {
      const n = parseInt(m.value.trim(), 10);
      if (!Number.isFinite(n) || n < 0) return;
      const key = m.dataset.fk;
      edits.fuel[key] = Object.assign({}, edits.fuel[key], { [m.dataset.fm]: Math.min(n, 2000) });
      saveEdits();
    }
  });

  app.addEventListener('change', e => {
    if (e.target.closest('[data-e]') || e.target.closest('[data-fm]') || e.target.closest('[data-c]')) render();
  });
}

/* ===========================================================
   BOOT
   =========================================================== */
loadLocal();
loadEdits();
render();

if ('serviceWorker' in navigator) {
  // A worker already controlling the page means this load came from cache,
  // so when a newer one takes over we are looking at stale content: reload.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        reg.update();
        // Catch deploys that land while the app sits open in the background.
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update();
        });
      })
      .catch(() => {});
  });
}
</script>
</body>
</html>
